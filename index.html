<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MODA | BM25</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f5;color:#171717}header{background:#111;color:white;position:sticky;top:0;z-index:5}.nav{max-width:1200px;margin:auto;padding:18px;display:flex;gap:18px;align-items:center}.logo{font-size:23px;font-weight:bold;letter-spacing:4px}.search{flex:1;display:flex}.search input{width:100%;padding:13px;border:0;border-radius:8px 0 0 8px}.search button{border:0;padding:0 18px;border-radius:0 8px 8px 0}.cart{background:#222;color:white;border:1px solid #555;padding:12px;border-radius:8px}.hero,main,.filters{max-width:1200px;margin:auto;padding-left:18px;padding-right:18px}.hero{padding-top:55px;padding-bottom:25px}.hero h1{font-size:48px;margin:0 0 10px}.hero p{color:#666}.filters{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:20px}.filter{padding:9px 14px;border-radius:30px;border:1px solid #ddd;background:white}.active{background:#111;color:white}.notice{background:#eee;padding:12px;border-radius:9px;font-size:13px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:white;border:1px solid #e5e5e5;border-radius:14px;overflow:hidden}.pic{aspect-ratio:4/5;background:#eee}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:14px}.cat{font-size:11px;color:#888;text-transform:uppercase}.name{font-weight:bold;margin:5px 0}.desc{font-size:12px;color:#777;min-height:35px}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.add,.checkout{background:#111;color:white;border:0;padding:10px 13px;border-radius:7px}.drawer{position:fixed;right:-430px;top:0;width:420px;max-width:94%;height:100%;background:white;z-index:10;padding:22px;box-shadow:-5px 0 20px #0003;transition:.2s;overflow:auto}.open{right:0}.cartitem{display:flex;gap:10px;border-bottom:1px solid #eee;padding:12px 0}.cartitem img{width:60px;height:75px;object-fit:cover}.qty button{margin:5px}.checkout{width:100%;margin-top:15px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center}.modal.show{display:flex}.box{background:white;padding:25px;border-radius:14px;width:400px;max-width:90%}.box input{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:7px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:36px}.nav{flex-wrap:wrap}.search{flex-basis:100%;order:3}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="nav"><b class="logo">MODA</b><div class="search"><input id="q" placeholder="Busca: vestido floral, camisa azul..."><button onclick="buscar()">🔎</button></div><button class="cart" onclick="toggle()">🛒 <span id="count">0</span></button></div></header>
<section class="hero"><h1>Tu estilo,<br>en un solo lugar.</h1><p>Encuentra prendas rápidamente con un buscador que utiliza <b>BM25</b> para ordenar los resultados por relevancia.</p></section>
<div class="filters" id="filters"></div><main><div class="notice" id="notice">Escribe una consulta para activar BM25.</div><div id="grid" class="grid"></div></main>
<aside id="drawer" class="drawer"><h2>Tu carrito <button onclick="toggle()">✕</button></h2><div id="cart"></div><h3 id="total"></h3><button class="checkout" onclick="checkout()">Finalizar compra</button></aside>
<div id="modal" class="modal"><div class="box"><h2>Checkout</h2><input id="name" placeholder="Nombre"><input id="email" placeholder="Correo"><button class="checkout" onclick="order()">Confirmar pedido</button><p id="result"></p></div></div>
<script>
let ps=[],cart=[],cat="Todas";const $=id=>document.getElementById(id),money=n=>"S/ "+n.toFixed(2);
async function init(){ps=await fetch("/api/products").then(r=>r.json());let cs=["Todas",...new Set(ps.map(p=>p.category))];$("filters").innerHTML=cs.map(c=>`<button class="filter ${c==="Todas"?"active":""}" onclick="setcat('${c}')">${c}</button>`).join("");buscar()}
async function buscar(){let q=$("q").value,d=await fetch("/api/search?q="+encodeURIComponent(q)+"&category="+encodeURIComponent(cat)).then(r=>r.json());render(d.results);$("notice").innerHTML=q?`<b>BM25 activo:</b> consulta procesada: [${d.processedQuery.join(", ")}].`:"Escribe una consulta para activar BM25."}
function setcat(c){cat=c;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x.textContent===c));buscar()}
function render(a){$("grid").innerHTML=a.map(p=>`<article class="card"><div class="pic"><img src="${p.image}"></div><div class="info"><div class="cat">${p.category}${p.score?` · BM25 ${p.score.toFixed(2)}`:""}</div><div class="name">${p.name}</div><div class="desc">${p.description}</div><div class="bottom"><b>${money(p.price)}</b><button class="add" onclick="add('${p.id}')">Agregar</button></div></div></article>`).join("")||"<p>No encontramos productos.</p>"}
function add(id){let p=ps.find(x=>x.id===id),x=cart.find(x=>x.id===id);x?x.quantity++:cart.push({...p,quantity:1});update();$("drawer").classList.add("open")}
function update(){$("count").textContent=cart.reduce((s,x)=>s+x.quantity,0);$("cart").innerHTML=cart.length?cart.map(x=>`<div class="cartitem"><img src="${x.image}"><div><b>${x.name}</b><br>${money(x.price)}<div class="qty"><button onclick="chg('${x.id}',-1)">−</button>${x.quantity}<button onclick="chg('${x.id}',1)">+</button></div></div></div>`).join(""):"Carrito vacío";$("total").textContent="Total: "+money(cart.reduce((s,x)=>s+x.price*x.quantity,0))}
function chg(id,d){let x=cart.find(x=>x.id===id);x.quantity+=d;if(x.quantity<1)cart=cart.filter(y=>y.id!==id);update()}function toggle(){$("drawer").classList.toggle("open");update()}
function checkout(){if(!cart.length)return alert("Agrega productos primero");$("modal").classList.add("show")}
async function order(){let r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items:cart,customer:{name:$("name").value,email:$("email").value}})}).then(r=>r.json());$("result").innerHTML=`✅ Pedido ${r.orderId} registrado. Total ${money(r.total)}.`;cart=[];update()}
$("q").addEventListener("keydown",e=>e.key==="Enter"&&buscar());init();
</script></body></html>
