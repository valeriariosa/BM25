trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Instalar Node.js'

- script: |
    npm install
  displayName: 'Instalar dependencias'

- script: |
    npm test --if-present
  displayName: 'Ejecutar pruebas unitarias'

- script: |
    npm run build
  displayName: 'Compilar proyecto'